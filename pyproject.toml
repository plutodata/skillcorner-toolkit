[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcorner-toolkit"
version = "0.0.0+3389bf6"
description = "Installable packaging of the public SkillCorner synchronization toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.18.5",
    "pandas>=1.3.5",
    "scipy>=1.7.3",
    "python-dateutil>=2.8.2",
]

[project.urls]
Source = "https://github.com/SkillCorner/skillcorner-toolkit"
Packaging = "https://github.com/plutodata/skillcorner-toolkit"

[tool.setuptools.packages.find]
include = ["event_synchronization*"]
